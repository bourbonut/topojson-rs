[package]
name = "topojson-rs"
version = "0.4.0"
edition = "2024"

[lib]
name = "topojson"
crate-type = ["cdylib"]

[dependencies]
indexmap = "2.14.1"
pyo3 = { version = "0.29.2", features = ["macros", "serde"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
json = "0.12.4"
reqwest = "0.13.4"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
